name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  distribuicao-zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar PostgreSQL para os testes isolados
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql

      - name: Testar funções, gatilhos, permissões e concorrência da fila
        run: python3 scripts/test-zap-distribuicao-postgres.py --pg-bin "$(pg_config --bindir)"

      - name: Testar fila individual em Pausa e excedente global
        run: python3 scripts/test-zap-fila-individual-postgres.py --pg-bin "$(pg_config --bindir)"

      - name: Testar leitura operacional e contadores por perfil
        run: python3 scripts/test-zap-leitura-postgres.py --pg-bin "$(pg_config --bindir)"

  verificar:
    name: ${{ matrix.nome }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: Lint
            comando: bun run lint
          - nome: Typecheck
            comando: bun run typecheck
          - nome: Testes
            comando: bun run test
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: ${{ matrix.nome }}
        run: ${{ matrix.comando }}
